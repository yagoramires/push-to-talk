name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# A newer push to main replaces a build still running for an older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Push to main: Windows only (Mac runner minutes cost 10x); tags and manual runs: both.
        os: ${{ fromJSON(github.event_name == 'push' && github.ref_type == 'branch' && '["windows-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      SCRIPT: ${{ matrix.os == 'windows-latest' && 'build:win' || 'build:mac' }}
      INSTALLER: ${{ matrix.os == 'windows-latest' && 'dist/*.exe' || 'dist/*.dmg' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ env.SCRIPT }}

      - name: Self-check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # piping makes PowerShell wait for the GUI-subsystem exe and show its stdout
        run: |
          & "dist/win-unpacked/Ingles.exe" --self-check | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Self-check (Mac)
        if: runner.os == 'macOS'
        run: dist/mac-arm64/Ingles.app/Contents/MacOS/Ingles --self-check

      - name: Installer size
        shell: bash
        run: ls -lh ${{ env.INSTALLER }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # llama.cpp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # the versions android/app/build.gradle pins (the runner image may not have them)
      - name: NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null

      - name: Keystore
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 is empty: the APK is debug-signed and will not update over a release-signed one"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ingles-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ingles-release.jks" >> "$GITHUB_ENV"
          fi
      - run: npm run build:android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename and size
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Ingles-$VERSION-android.apk"
          ls -lh dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: installer-Android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.apk
